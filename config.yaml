# VelveteenTrade strategy configuration.
# Everything here is deterministic policy — the LLM cannot override any of it.

universe:
  # Liquid US large caps + sector/index ETFs. ~30 symbols keeps data and LLM costs low.
  - SPY
  - QQQ
  - IWM
  - XLE
  - XLF
  - XLK
  - XLV
  - GLD
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - AVGO
  - JPM
  - V
  - UNH
  - JNJ
  - XOM
  - CVX
  - PG
  - KO
  - HD
  - CAT
  - BA
  - DIS
  - NFLX
  - AMD

candidates_per_cycle: 5   # symbols that get full LLM analysis per cycle (held positions always included)
history_days: 320

risk:
  max_position_pct: 0.10
  max_positions: 8
  max_gross_exposure: 1.0
  per_trade_risk_pct: 0.01
  stop_atr_mult: 2.0
  max_daily_turnover_pct: 0.25
  # Umbral del freno por drawdown. Rige aunque exista un perfil: el perfil fija
  # los demás límites, pero este umbral y la ventana de abajo salen siempre de
  # aquí (profile.CONFIG_OWNED). Decisión del 14 nov 2026: el satélite frena al
  # 10 %, no al 5 % que daría un perfil de tolerancia 1.
  max_drawdown_halt_pct: 0.10
  # R31: el freno mide la caída contra el máximo de las últimas N sesiones
  # (antes: el máximo histórico, y el freno nunca se soltaba). 126 ≈ 6 meses.
  # Valor provisional: lo decide el mantenedor. Entero entre 2 y 2520 (config.py,
  # WINDOW_MIN y WINDOW_MAX); fuera de ese rango el bot no arranca.
  drawdown_window_sessions: 126
  min_conviction: 3
  max_cvar_95_20d: -0.25
  max_sector_exposure_pct: 0.30

# R20: reparto núcleo/satélite. Decisión del mantenedor (12 nov 2026): el núcleo de
# ETF vive en OTRA cuenta paper, así que esta cuenta es 100 % satélite. El
# satélite es el 20 % del capital total en paper y el 10 % con dinero real
# (sube al 20 % solo si bate a VTI neto de costos en 6-12 meses).
#   mode: separate_account | profile (antes: núcleo del perfil en esta cuenta)
# El perfil sigue fijando los límites de riesgo, no el reparto.
allocation:
  mode: separate_account
  # USD, núcleo + satélite. PROVISIONAL: 8.000 del núcleo paper / 0,80 = 10.000.
  # Con dinero real el total real NO va aquí (el repo es público): se define en
  # la variable de servicio SATELLITE_TOTAL_CAPITAL, que manda sobre este valor.
  total_capital: 10000
  satellite_pct_paper: 0.20
  satellite_pct_live: 0.10

models:
  provider: openai        # openai | anthropic — switch here or via LLM_PROVIDER env var
  # analyst: gpt-5-mini   # uncomment to override defaults
  # executive: gpt-5
