name: tests

# R20 (14 nov 2026): reemplaza a daily.yml. El ciclo de trading NO corre aquí:
# su único programador es el bot de Railway, con el journal persistente en
# /data. Este workflow solo corre los tests; no usa secretos ni llaves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (sin llaves; no contactan al bróker)
        run: python -m pytest -q
